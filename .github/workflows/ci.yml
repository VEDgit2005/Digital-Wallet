name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Tests on SQLite (fast path, concurrency tests skipped)
        run: pytest -q

      - name: Tests on PostgreSQL (full suite incl. concurrency) with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://wallet:wallet@localhost:5432/wallet_test
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
